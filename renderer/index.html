<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <div class="brand" aria-label="DSH Desktop">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>DSH Desktop</span>
      </div>

      <section class="status" aria-live="polite">
        <div id="indicator" class="indicator is-starting" aria-hidden="true"></div>
        <p id="eyebrow" class="eyebrow">LOCAL RUNTIME</p>
        <h1 id="title">Starting Harness</h1>
        <p id="message">Preparing the local agent runtime...</p>
        <div id="progress" class="progress"><span></span></div>
        <div id="actions" class="actions" hidden>
          <button id="retry" class="primary" type="button">Retry</button>
          <button id="logs" type="button">Show Log</button>
        </div>
      </section>

      <footer>Official DeepSeek Harness, locally hosted</footer>
    </main>
    <script src="./loading.js"></script>
  </body>
</html>
